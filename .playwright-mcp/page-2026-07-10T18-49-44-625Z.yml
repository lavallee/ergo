            - cell [ref=e79]:
              - text: Modern
              - code [ref=e80]: .xlsx
              - text: with separate
              - strong [ref=e81]: State / District / School
              - text: sheets.
            - cell [ref=e82]:
              - text: One row per
              - emphasis [ref=e83]: school
              - text: ", with plainly-named columns ("
              - code [ref=e84]: White
              - text: ","
              - code [ref=e85]: Black
              - text: ","
              - code [ref=e86]: Hispanic
              - text: …) and a
              - strong [ref=e87]: percentage column next to each count
              - text: . Read the count, skip the percent.
      - paragraph [ref=e88]:
        - text: "Two practical notes that cost us time: header rows are"
        - strong [ref=e89]: not
        - text: always the first row (scan the first several rows for a known label like a district-code column), and the way to tell Era B from Era C apart — both are
        - code [ref=e90]: .xlsx
        - text: — is to look at the
        - strong [ref=e91]: sheet names
        - text: ": if there are separate \"School\" and \"District\" sheets, it’s Era C; otherwise treat it as an Era B long workbook."
      - heading "2 · What’s counted, and when it changed" [level=2] [ref=e92]
      - paragraph [ref=e93]:
        - text: "The single most important thing to understand: the race/ethnicity categories are"
        - emphasis [ref=e94]: not
        - text: constant across the 28 years.
      - paragraph [ref=e95]:
        - text: "Five categories run the entire series, unchanged in meaning:"
        - strong [ref=e96]: White, Black, Hispanic, Asian, and Native American
        - text: ". Two more appear partway through. Here’s exactly where:"
      - table [ref=e97]:
        - rowgroup [ref=e98]:
          - row [ref=e99]:
            - columnheader "Category" [ref=e100]
            - columnheader "Present" [ref=e101]
            - columnheader "Note" [ref=e102]
          - row [ref=e103]:
            - cell "White, Black, Hispanic, Native American" [ref=e104]
            - cell "1998–99 → 2025–26 (all 28 yrs)" [ref=e105]
            - cell "Stable throughout." [ref=e106]
          - row [ref=e107]:
            - cell "Asian" [ref=e108]
            - cell "1998–99 → 2025–26 (all 28 yrs)" [ref=e109]
            - cell [ref=e110]:
              - text: But its
              - emphasis [ref=e111]: meaning
              - text: narrows in 2006–07 — see below.
          - row [ref=e112]:
            - cell [ref=e113]:
              - strong [ref=e114]: Native Hawaiian / Pacific Islander
            - cell [ref=e115]:
              - strong [ref=e116]: 2006–07
              - text: → 2025–26 (20 yrs)
            - cell [ref=e117]:
              - text: Split out as its own category. Before 2006–07 these students were counted inside
              - strong [ref=e118]: Asian
              - text: .
          - row [ref=e119]:
            - cell [ref=e120]:
              - strong [ref=e121]: Two or More Races
            - cell [ref=e122]:
              - strong [ref=e123]: 2006–07
              - text: → 2025–26 (20 yrs)
            - cell "New multiracial category. Before 2006–07 there was no way to be multiracial; students were assigned a single race." [ref=e124]
      - generic [ref=e125]:
        - strong [ref=e126]: The break is 2006–07.
        - text: That year New Jersey moved from a 5-category race scheme to a 7-category one, adding
        - emphasis [ref=e127]: Native Hawaiian/Pacific Islander
        - text: (carved out of Asian) and
        - emphasis [ref=e128]: Two or More Races
        - text: . This happened
        - emphasis [ref=e129]: inside
        - text: the CSV era — it’s a separate axis from the format eras above, and it’s the change that most often trips up year-over-year comparisons.
      - heading "Non-race dimensions phase in at different times, too" [level=3] [ref=e130]
      - table [ref=e131]:
        - rowgroup [ref=e132]:
          - row [ref=e133]:
