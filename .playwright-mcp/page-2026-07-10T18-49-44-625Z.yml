    - heading "New Jersey Fall Enrollment, 1998–2026" [level=1] [ref=e15]
    - paragraph [ref=e16]: Data through 2025–26 · updated June 2026
    - generic [ref=e17]:
      - heading "The source" [level=2] [ref=e18]
      - paragraph [ref=e19]:
        - text: The data comes from the
        - strong [ref=e20]: New Jersey Department of Education Fall Enrollment Reports
        - text: ", published at"
        - link "nj.gov/education/doedata/enr" [ref=e21] [cursor=pointer]:
          - /url: https://www.nj.gov/education/doedata/enr/
        - text: . It’s an annual fall headcount of every student in every public school and district in the state, broken out by grade, race/ethnicity, and economic and program status. The state posts
        - strong [ref=e22]: one ZIP file per school year
        - text: ", and the series runs from"
        - strong [ref=e23]: 1998–99 through 2025–26
        - text: — 28 years.
      - paragraph [ref=e24]:
        - text: Each ZIP holds a single file (CSV or Excel) whose name and shape depend on the year. The grain underneath is consistent in spirit — numbers for each school — but the container, the column names, and even
        - emphasis [ref=e25]: which
        - text: categories exist have all changed over the years. That’s the whole challenge.
      - navigation "Contents" [ref=e26]:
        - link "1 · Three format eras" [ref=e27] [cursor=pointer]:
          - /url: "#eras"
        - link "2 · What’s counted, and when it changed" [ref=e28] [cursor=pointer]:
          - /url: "#categories"
        - link "3 · Comparing years fairly" [ref=e29] [cursor=pointer]:
          - /url: "#compare"
        - link "4 · Gotchas we hit the hard way" [ref=e30] [cursor=pointer]:
          - /url: "#gotchas"
        - link "5 · The database we built" [ref=e31] [cursor=pointer]:
          - /url: "#database"
        - link "6 · Reproducing it" [ref=e32] [cursor=pointer]:
          - /url: "#reproduce"
        - link "7 · How we checked the work" [ref=e33] [cursor=pointer]:
          - /url: "#validation"
      - heading "1 · Three format eras" [level=2] [ref=e34]
      - paragraph [ref=e35]: The state rebuilt the report format twice. There are three distinct generations, and a parser has to detect which one it’s looking at before it can read a row.
