              - strong [ref=e45]: A
            - cell "1998–99 → 2008–09 (11 yrs)" [ref=e46]
            - cell [ref=e47]:
              - text: One CSV,
              - code [ref=e48]: STAT_ENR.CSV
            - cell [ref=e49]:
              - text: One row per
              - emphasis [ref=e50]: school × program/grade
              - text: . Race is split into
              - strong [ref=e51]: sex-coded columns
              - text: —
              - code [ref=e52]: WHM
              - text: /
              - code [ref=e53]: WHF
              - text: (white male/female),
              - code [ref=e54]: BLM
              - text: /
              - code [ref=e55]: BLF
              - text: ","
              - code [ref=e56]: HIM
              - text: /
              - code [ref=e57]: HIF
              - text: ", and so on. You sum male+female to get a race count."
          - row [ref=e58]:
