              - strong [ref=e63]:
                - text: 2009–10 and 2010–11 are legacy binary
                - code [ref=e64]: .xls
              - text: (must be converted, e.g. via LibreOffice, before a modern library will open them); 2011–12 onward are
              - code [ref=e65]: .xlsx
              - text: ". Filenames drift:"
              - code [ref=e66]: enr.xls
              - text: ","
              - code [ref=e67]: enr.xlsx
              - text: ","
              - code [ref=e68]: EnrollmentReport.xlsx
              - text: .
            - cell [ref=e69]:
              - text: "A long \"SQL Results\"–style sheet: one row per"
              - emphasis [ref=e70]: school × grade × program
              - text: ", with race still as"
              - strong [ref=e71]: race × gender
              - text: columns. Header naming shifts (
              - code [ref=e72]: WhiteM
              - text: vs
