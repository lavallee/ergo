          - strong [ref=f2e305]: "The bite:"
          - text: "'Two or More Races' and 'Native Hawaiian/Pacific Islander' don't exist before 2006-07 — and the warehouse stores 0, not NULL, for them in every earlier year, so a naive trend line reads a definitional change as a demographic swing."
        - group [ref=f2e306]:
