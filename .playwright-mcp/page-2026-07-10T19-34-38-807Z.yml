    - generic [ref=f2e14]: Data explainer
    - heading "New Jersey Fall Enrollment, 1998–2026" [level=1] [ref=f2e15]
    - paragraph [ref=f2e16]: Data through 2025–26 · updated June 2026
    - generic [ref=f2e17]:
      - heading "The source" [level=2] [ref=f2e18]
      - paragraph [ref=f2e19]:
        - text: The data comes from the
        - strong [ref=f2e20]: New Jersey Department of Education Fall Enrollment Reports
        - text: ", published at"
        - link "nj.gov/education/doedata/enr" [ref=f2e21] [cursor=pointer]:
          - /url: https://www.nj.gov/education/doedata/enr/
        - text: . It’s an annual fall headcount of every student in every public school and district in the state, broken out by grade, race/ethnicity, and economic and program status. The state posts
        - strong [ref=f2e22]: one ZIP file per school year
        - text: ", and the series runs from"
        - strong [ref=f2e23]: 1998–99 through 2025–26
        - text: — 28 years.
      - paragraph [ref=f2e24]:
        - text: Each ZIP holds a single file (CSV or Excel) whose name and shape depend on the year. The grain underneath is consistent in spirit — numbers for each school — but the container, the column names, and even
        - emphasis [ref=f2e25]: which
        - text: categories exist have all changed over the years. That’s the whole challenge.
      - navigation "Contents" [ref=f2e26]:
        - link "1 · Three format eras" [ref=f2e27] [cursor=pointer]:
          - /url: "#eras"
        - link "2 · What’s counted, and when it changed" [ref=f2e28] [cursor=pointer]:
          - /url: "#categories"
        - link "3 · Comparing years fairly" [ref=f2e29] [cursor=pointer]:
          - /url: "#compare"
        - link "4 · Gotchas we hit the hard way" [ref=f2e30] [cursor=pointer]:
          - /url: "#gotchas"
        - link "5 · The database we built" [ref=f2e31] [cursor=pointer]:
          - /url: "#database"
        - link "6 · Reproducing it" [ref=f2e32] [cursor=pointer]:
          - /url: "#reproduce"
        - link "7 · How we checked the work" [ref=f2e33] [cursor=pointer]:
          - /url: "#validation"
        - link "8 · The issue registry" [ref=f2e34] [cursor=pointer]:
          - /url: "#ergo"
      - heading "1 · Three format eras" [level=2] [ref=f2e35]
      - paragraph [ref=f2e36]: The state rebuilt the report format twice. There are three distinct generations, and a parser has to detect which one it’s looking at before it can read a row.
      - table [ref=f2e37]:
        - rowgroup [ref=f2e38]:
          - row [ref=f2e39]:
            - columnheader "Era" [ref=f2e40]
            - columnheader "Years" [ref=f2e41]
            - columnheader "Container" [ref=f2e42]
            - columnheader "Shape" [ref=f2e43]
          - row [ref=f2e44]:
            - cell [ref=f2e45]:
              - strong [ref=f2e46]: A
            - cell "1998–99 → 2008–09 (11 yrs)" [ref=f2e47]
            - cell [ref=f2e48]:
              - text: One CSV,
              - code [ref=f2e49]: STAT_ENR.CSV
            - cell [ref=f2e50]:
              - text: One row per
              - emphasis [ref=f2e51]: school × program/grade
              - text: . Race is split into
              - strong [ref=f2e52]: sex-coded columns
              - text: —
              - code [ref=f2e53]: WHM
              - text: /
              - code [ref=f2e54]: WHF
              - text: (white male/female),
              - code [ref=f2e55]: BLM
              - text: /
              - code [ref=f2e56]: BLF
              - text: ","
              - code [ref=f2e57]: HIM
              - text: /
              - code [ref=f2e58]: HIF
              - text: ", and so on. You sum male+female to get a race count."
          - row [ref=f2e59]:
            - cell [ref=f2e60]:
              - strong [ref=f2e61]: B
            - cell "2009–10 → 2018–19 (10 yrs)" [ref=f2e62]
            - cell [ref=f2e63]:
              - text: Excel "long" workbook.
              - strong [ref=f2e64]:
                - text: 2009–10 and 2010–11 are legacy binary
                - code [ref=f2e65]: .xls
              - text: (must be converted, e.g. via LibreOffice, before a modern library will open them); 2011–12 onward are
              - code [ref=f2e66]: .xlsx
              - text: ". Filenames drift:"
              - code [ref=f2e67]: enr.xls
              - text: ","
              - code [ref=f2e68]: enr.xlsx
              - text: ","
              - code [ref=f2e69]: EnrollmentReport.xlsx
              - text: .
            - cell [ref=f2e70]:
              - text: "A long \"SQL Results\"–style sheet: one row per"
              - emphasis [ref=f2e71]: school × grade × program
              - text: ", with race still as"
              - strong [ref=f2e72]: race × gender
              - text: columns. Header naming shifts (
              - code [ref=f2e73]: WhiteM
              - text: vs
              - code [ref=f2e74]: WHM
              - text: ), and some years mislabel the grade column "Total" on every row, keeping the real grade in a separate
              - code [ref=f2e75]: PRGCODE
              - text: .
          - row [ref=f2e76]:
            - cell [ref=f2e77]:
              - strong [ref=f2e78]: C
            - cell "2019–20 → 2025–26 (7 yrs)" [ref=f2e79]
            - cell [ref=f2e80]:
              - text: Modern
              - code [ref=f2e81]: .xlsx
              - text: with separate
              - strong [ref=f2e82]: State / District / School
              - text: sheets.
            - cell [ref=f2e83]:
              - text: One row per
              - emphasis [ref=f2e84]: school
              - text: ", with plainly-named columns ("
              - code [ref=f2e85]: White
              - text: ","
              - code [ref=f2e86]: Black
              - text: ","
              - code [ref=f2e87]: Hispanic
              - text: …) and a
              - strong [ref=f2e88]: percentage column next to each count
              - text: . Read the count, skip the percent.
      - paragraph [ref=f2e89]:
        - text: "Two practical notes that cost us time: header rows are"
        - strong [ref=f2e90]: not
        - text: always the first row (scan the first several rows for a known label like a district-code column), and the way to tell Era B from Era C apart — both are
        - code [ref=f2e91]: .xlsx
        - text: — is to look at the
        - strong [ref=f2e92]: sheet names
        - text: ": if there are separate \"School\" and \"District\" sheets, it’s Era C; otherwise treat it as an Era B long workbook."
      - heading "2 · What’s counted, and when it changed" [level=2] [ref=f2e93]
      - paragraph [ref=f2e94]:
        - text: "The single most important thing to understand: the race/ethnicity categories are"
        - emphasis [ref=f2e95]: not
        - text: constant across the 28 years.
      - paragraph [ref=f2e96]:
        - text: "Five categories run the entire series, unchanged in meaning:"
        - strong [ref=f2e97]: White, Black, Hispanic, Asian, and Native American
        - text: ". Two more appear partway through. Here’s exactly where:"
      - table [ref=f2e98]:
        - rowgroup [ref=f2e99]:
          - row [ref=f2e100]:
            - columnheader "Category" [ref=f2e101]
            - columnheader "Present" [ref=f2e102]
            - columnheader "Note" [ref=f2e103]
          - row [ref=f2e104]:
            - cell "White, Black, Hispanic, Native American" [ref=f2e105]
            - cell "1998–99 → 2025–26 (all 28 yrs)" [ref=f2e106]
            - cell "Stable throughout." [ref=f2e107]
          - row [ref=f2e108]:
            - cell "Asian" [ref=f2e109]
            - cell "1998–99 → 2025–26 (all 28 yrs)" [ref=f2e110]
            - cell [ref=f2e111]:
              - text: But its
              - emphasis [ref=f2e112]: meaning
              - text: narrows in 2006–07 — see below.
          - row [ref=f2e113]:
            - cell [ref=f2e114]:
              - strong [ref=f2e115]: Native Hawaiian / Pacific Islander
            - cell [ref=f2e116]:
              - strong [ref=f2e117]: 2006–07
              - text: → 2025–26 (20 yrs)
            - cell [ref=f2e118]:
              - text: Split out as its own category. Before 2006–07 these students were counted inside
              - strong [ref=f2e119]: Asian
              - text: .
          - row [ref=f2e120]:
            - cell [ref=f2e121]:
              - strong [ref=f2e122]: Two or More Races
            - cell [ref=f2e123]:
              - strong [ref=f2e124]: 2006–07
              - text: → 2025–26 (20 yrs)
            - cell "New multiracial category. Before 2006–07 there was no way to be multiracial; students were assigned a single race." [ref=f2e125]
      - generic [ref=f2e126]:
        - strong [ref=f2e127]: The break is 2006–07.
        - text: That year New Jersey moved from a 5-category race scheme to a 7-category one, adding
        - emphasis [ref=f2e128]: Native Hawaiian/Pacific Islander
        - text: (carved out of Asian) and
        - emphasis [ref=f2e129]: Two or More Races
        - text: . This happened
        - emphasis [ref=f2e130]: inside
        - text: the CSV era — it’s a separate axis from the format eras above, and it’s the change that most often trips up year-over-year comparisons.
      - heading "Non-race dimensions phase in at different times, too" [level=3] [ref=f2e131]
      - table [ref=f2e132]:
        - rowgroup [ref=f2e133]:
          - row [ref=f2e134]:
            - columnheader "Dimension" [ref=f2e135]
            - columnheader "Coverage" [ref=f2e136]
          - row [ref=f2e137]:
            - cell "Free / reduced-price lunch (economic disadvantage)" [ref=f2e138]
            - cell [ref=f2e139]:
              - text: Back to 1998–99, but
              - strong [ref=f2e140]: blank ~2019–20 → 2021–22
              - text: in the source.
          - row [ref=f2e141]:
            - cell "Multilingual / English learners (labeled LEP, then ELL, then ML over time — same dimension)" [ref=f2e142]
            - cell "From ~2005–06." [ref=f2e143]
          - row [ref=f2e144]:
            - cell "Migrant" [ref=f2e145]
            - cell "From ~2005–06." [ref=f2e146]
          - row [ref=f2e147]:
            - cell "Military-connected, Homeless" [ref=f2e148]
            - cell [ref=f2e149]:
              - text: Modern only —
              - strong [ref=f2e150]: 2022–23 onward
              - text: .
          - row [ref=f2e151]:
            - cell "Gender (male/female by race)" [ref=f2e152]
            - cell "Exists in the legacy source files (1998–2018) but we do not load it." [ref=f2e153]
      - heading "3 · Comparing years fairly" [level=2] [ref=f2e154]
      - paragraph [ref=f2e155]: "Because 2006–07 reshuffled the categories, you cannot naively compare raw race shares across that line. Two rules make any two years comparable:"
      - paragraph [ref=f2e156]:
        - strong [ref=f2e157]: Fold Pacific Islander back into Asian.
        - text: Since Asian
        - emphasis [ref=f2e158]: included
        - text: Pacific Islander before 2006–07, the consistent measure across all 28 years is
        - strong [ref=f2e159]: Asian + Native Hawaiian/Pacific Islander
        - text: .
      - paragraph [ref=f2e160]:
        - strong [ref=f2e161]: Only set aside "Two or More Races" when a comparison reaches back before it existed.
        - text: "Because the category (and a separate Pacific Islander count) didn’t exist before 2006–07, including it in a comparison that crosses that line would count a group one side structurally couldn’t have. So the rule is best-available: when"
        - emphasis [ref=f2e162]: both
        - text: chosen years are 2006–07 or later, use all seven groups; when the range reaches earlier, fall back to the five consistent ones — White, Black, Hispanic, Asian (incl. Pacific Islander), Native American — with "two or more" set aside. Either way the shares are re-shared to sum to 100%.
      - paragraph [ref=f2e163]:
        - text: That is exactly what the
        - link "demographic-shift explorer" [ref=f2e164] [cursor=pointer]:
          - /url: /demographic-shift-index/
        - text: does. Its Demographic Shift Index is
        - code [ref=f2e165]: ½ · Σ |Δ share|
        - text: "over whichever group set the chosen years support: the share of students who would have to be a different race to turn the earlier year’s mix into the later one’s."
      - heading "4 · Gotchas we hit the hard way" [level=2] [ref=f2e166]
      - heading "Totals vs. grade rows — don’t double-count" [level=3] [ref=f2e167]
      - paragraph [ref=f2e168]:
        - text: "In the CSV and long-workbook eras, each school has many rows: an authoritative"
        - strong [ref=f2e169]: "\"Total\" row"
        - text: plus per-grade rows (and sometimes special-education-by-disability rows that are already
        - emphasis [ref=f2e170]: inside
        - text: the Total). Take a school’s total, race, and lunch counts from the
        - strong [ref=f2e171]: Total row
        - text: ; take per-grade counts from the grade rows;
        - strong [ref=f2e172]: never add the two together
        - text: . Only fall back to summing grade rows when a Total row is genuinely absent.
      - heading "Per-grade counts don’t always add up to the total — ungraded students" [level=3] [ref=f2e173]
      - paragraph [ref=f2e174]:
        - text: A school’s
        - strong [ref=f2e175]: per-grade columns can sum to less than its total
        - text: ", and that is not a parsing error. New Jersey’s headcount"
        - strong [ref=f2e176]: counts ungraded students
        - text: — overwhelmingly special-education students who carry no grade level. They are in the total but in no grade. So at
        - strong [ref=f2e177]: special-services schools
        - text: (regional day schools, schools for the deaf, county educational-services commissions) the grade columns sit near zero against a real total, and at ordinary schools with a special-education program the grades fall short by exactly that ungraded population — Vineland Senior High lands around 89% of its total in graded rows, Newark’s Abington Avenue School around 85%. Across the series, roughly
        - strong [ref=f2e178]: three-quarters to nine-tenths of schools
        - text: have grades that sum to the full total in any given year; the rest carry ungraded students.
      - paragraph [ref=f2e179]:
        - text: "The general rule we use against that shortfall:"
        - strong [ref=f2e180]: trust per-grade detail for a year only when the grades sum to roughly the total
        - text: (we require ≥ 90%); otherwise treat that year’s by-grade view as incomplete and fall back to the Total row.
      - paragraph [ref=f2e181]:
        - text: This is
        - emphasis [ref=f2e182]: not
        - text: "a gender artifact, which we checked directly: race in the legacy files is sex-split ("
        - code [ref=f2e183]: WHM
        - text: /
        - code [ref=f2e184]: WHF
        - text: ), so picking up only one sex would pull grade sums toward 50% of the total. Fewer than 1% of rows land near there — the male + female counts are being summed correctly.
      - heading "A misspelled column dropped grade 8 for three years" [level=3] [ref=f2e185]
      - paragraph [ref=f2e186]:
        - text: For
        - strong [ref=f2e187]: 2020–21 through 2022–23
        - text: the state’s School and District sheets misspelled the grade-8 header as
        - strong [ref=f2e188]:
          - code [ref=f2e189]: Eight Grade
        - text: (missing the "h"); it reads
        - code [ref=f2e190]: Eighth Grade
        - text: in every other year. A column matcher looking for the correct spelling reads grade 8 as blank — for
        - emphasis [ref=f2e191]: every school in New Jersey
        - text: ", those three years. It surfaces first at"
        - strong [ref=f2e192]: middle schools
        - text: ", where grade 8 is the terminal cohort, so a 1,700-student school looks several hundred short; the students were never missing, only their grade-8 cell. The fix is to accept both spellings. It’s a reminder that the column"
        - emphasis [ref=f2e193]: names
        - text: are as much a moving target as the formats — match them loosely, and reconcile grade sums against the Total to catch a dropped column before it reaches a chart.
      - heading "Fractional counts are real" [level=3] [ref=f2e194]
      - paragraph [ref=f2e195]:
        - text: Shared-time students (those who split attendance between schools) are reported as
        - strong [ref=f2e196]: halves
        - text: . Counts are not always integers — there are roughly 4,400 fractional totals in the series. Preserve them as-is; don’t round on import.
      - heading "Rollup rows masquerading as schools" [level=3] [ref=f2e197]
      - paragraph [ref=f2e198]:
        - text: The files embed aggregate rows. A
        - strong [ref=f2e199]:
          - text: school code of
          - code [ref=f2e200]: "999"
        - text: ", or a school name containing \"TOTAL,\" is the"
        - emphasis [ref=f2e201]: district
        - text: total, not a building. A
        - strong [ref=f2e202]:
          - text: district code of
          - code [ref=f2e203]: "9999"
        - text: ", or names like \"County Total\" / \"State Total,\" are county/state rollups. Separate the district aggregates into their own table and drop the county/state rollups, or they’ll inflate everything."
      - heading "Suppressed and blank cells" [level=3] [ref=f2e204]
      - paragraph [ref=f2e205]:
        - text: Missing or suppressed values show up as
        - code [ref=f2e206]: .
        - text: ","
        - code [ref=f2e207]: "*"
        - text: ","
        - code [ref=f2e208]: "N"
        - text: ","
        - code [ref=f2e209]: "-"
        - text: ", or empty. Treat all of them as null, not zero."
      - heading "Codes are the identity; names drift" [level=3] [ref=f2e210]
      - paragraph [ref=f2e211]:
        - text: Normalize the codes — district to 4 digits, school to 3 — and key schools on
        - strong [ref=f2e212]:
          - code [ref=f2e213]: district_code
          - text: +
          - code [ref=f2e214]: school_code
        - text: ", which is globally unique in New Jersey and stable across years. Do"
        - emphasis [ref=f2e215]: not
        - text: key on county_code; it’s unreliable in some legacy files. School
        - emphasis [ref=f2e216]: names
        - text: ", meanwhile, drift constantly and sometimes change outright. One building in South Orange-Maplewood (district"
        - code [ref=f2e217]: "4900"
        - text: ", school"
        - code [ref=f2e218]: "090"
        - text: ") reads:"
      - code [ref=f2e220]: JEFFERSON 1998-99 → 2009-10 Jefferson E.S. 2010-11 Jefferson Elementary School 2011-12 → 2021-22 Delia Bolden Elementary School 2022-23 → 2025-26
      - paragraph [ref=f2e221]:
        - text: Same code throughout, four names. Track the history (we keep a
        - code [ref=f2e222]: school_name_history
        - text: table) so a rename doesn’t read as a school appearing and disappearing.
      - heading "5 · The database we built" [level=2] [ref=f2e223]
      - paragraph [ref=f2e224]:
        - text: All 28 years normalize into one SQLite file with three tables. Counts are stored as
        - code [ref=f2e225]: REAL
        - text: (to preserve the fractional shared-time values), and missing values are
        - code [ref=f2e226]: "NULL"
        - text: .
      - table [ref=f2e227]:
        - rowgroup [ref=f2e228]:
          - row [ref=f2e229]:
            - columnheader "Table" [ref=f2e230]
            - columnheader "Grain" [ref=f2e231]
            - columnheader "Rows" [ref=f2e232]
          - row [ref=f2e233]:
            - cell [ref=f2e234]:
              - code [ref=f2e235]: enrollment
            - cell [ref=f2e236]:
              - text: one row per
              - strong [ref=f2e237]: school × year
            - cell "~69,300" [ref=f2e238]
          - row [ref=f2e239]:
            - cell [ref=f2e240]:
              - code [ref=f2e241]: district_enrollment
            - cell [ref=f2e242]:
              - text: one row per
              - strong [ref=f2e243]: district × year
              - text: (authoritative district total; synthesized from member schools where the source omits it, and flagged)
            - cell "~18,400" [ref=f2e244]
          - row [ref=f2e245]:
            - cell [ref=f2e246]:
              - code [ref=f2e247]: school_name_history
            - cell [ref=f2e248]:
              - text: one row per
              - strong [ref=f2e249]: code × name
              - text: ", with first/last year — catches renames"
            - cell "—" [ref=f2e250]
      - paragraph [ref=f2e251]:
        - text: "Coverage:"
        - strong [ref=f2e252]: 744 districts, ~3,038 schools, all 21 NJ counties
        - text: (plus charter / state-operated groupings), 1998–99 → 2025–26.
      - paragraph [ref=f2e253]:
        - text: The
        - code [ref=f2e254]: enrollment
        - text: "schema:"
      - code [ref=f2e256]: CREATE TABLE enrollment ( school_year TEXT, county_code TEXT, county_name TEXT, district_code TEXT, district_name TEXT, school_code TEXT, school_name TEXT, total REAL, -- race / ethnicity (hawaiian_pi & two_or_more only populated from 2006-07) white REAL, black REAL, hispanic REAL, asian REAL, native_american REAL, hawaiian_pi REAL, two_or_more REAL, -- grades pk REAL, k REAL, g1 REAL, g2 REAL, g3 REAL, g4 REAL, g5 REAL, g6 REAL, g7 REAL, g8 REAL, g9 REAL, g10 REAL, g11 REAL, g12 REAL, -- economic / program free_lunch REAL, reduced_lunch REAL, ml_learners REAL, migrant REAL, military REAL, homeless REAL, PRIMARY KEY (school_year, county_code, district_code, school_code) ); -- district_enrollment mirrors these columns (no school_code/name; adds -- synthesized INTEGER), keyed (school_year, county_code, district_code).
      - paragraph [ref=f2e257]: "An example — every school’s economic-disadvantage rate for a given year:"
      - code [ref=f2e259]: SELECT school_year, district_name, school_name, ROUND(100.0 * (free_lunch + reduced_lunch) / total, 1) AS pct_frl FROM enrollment WHERE school_year = '2024-25' AND total >= 100 AND free_lunch IS NOT NULL ORDER BY pct_frl DESC;
      - heading "6 · Reproducing it" [level=2] [ref=f2e260]
      - paragraph [ref=f2e261]:
        - text: "A single build script reproduces the whole database from the public source. For each year it: downloads the ZIP from the state archive; detects the era (CSV → Era A; an Excel workbook with School + District sheets → Era C; any other workbook → the Era B long format, converting legacy"
        - code [ref=f2e262]: .xls
        - text: first); reads each row by matching column names against the known naming variants; applies the Total-row / grade-row / rollup rules above; normalizes codes; and writes the three tables. Everything in sections 1–4 is the spec it implements — given the raw ZIPs, that’s enough to rebuild the same schema from scratch.
      - heading "7 · How we checked the work" [level=2] [ref=f2e263]
      - paragraph [ref=f2e264]:
        - text: The pipeline’s output reproduces figures the South Orange-Maplewood district published itself (from its
        - link "Nov 2025 integration forum" [ref=f2e265] [cursor=pointer]:
          - /url: https://sites.google.com/somsd.k12.nj.us/somsdintegration/presentations
        - text: "), which validates the parse end to end across eras:"
      - table [ref=f2e266]:
        - rowgroup [ref=f2e267]:
          - row [ref=f2e268]:
            - columnheader "Figure" [ref=f2e269]
            - columnheader "Our extract" [ref=f2e270]
            - columnheader "District-published" [ref=f2e271]
          - row [ref=f2e272]:
            - cell "SOMSD White %, 1998–99" [ref=f2e273]
            - cell "43.8%" [ref=f2e274]
            - cell "44%" [ref=f2e275]
          - row [ref=f2e276]:
            - cell "SOMSD % free/reduced lunch, 1998–99" [ref=f2e277]
            - cell "17.0%" [ref=f2e278]
            - cell "16.9%" [ref=f2e279]
          - row [ref=f2e280]:
            - cell "South Mountain White %, 1998–99" [ref=f2e281]
            - cell "56.1%" [ref=f2e282]
            - cell "56%" [ref=f2e283]
          - row [ref=f2e284]:
            - cell "SOMSD White %, 2019–20" [ref=f2e285]
            - cell "55.4%" [ref=f2e286]
