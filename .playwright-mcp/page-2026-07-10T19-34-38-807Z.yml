        - group [ref=f2e308]:
          - generic "era-b-file-quirks [breaks · mitigated] 2009-10 and 2010-11 are binary .xls (openpyxl can't open them directly); the filename inside the zip also isn't fixed" [ref=f2e309] [cursor=pointer]
        - group [ref=f2e310]:
          - generic "header-naming-variants [breaks · mitigated] Race/sex columns use different header spellings by era (WhiteM vs WHM, and others)" [ref=f2e311] [cursor=pointer]
        - group [ref=f2e312]:
          - generic "grade-mislabeled-total-prgcode [corrupts · mitigated] Grade_Level reads 'Total' for every row in some Era B years; the real grade is in a separate PRGCODE column" [ref=f2e313] [cursor=pointer]
