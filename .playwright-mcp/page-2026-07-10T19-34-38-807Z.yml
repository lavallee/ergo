        - group [ref=f2e316]:
          - generic "era-b-vs-c-ambiguous [breaks · mitigated] File extension alone can't distinguish the long-workbook era from the School/District-sheet era — both are .xlsx" [ref=f2e317] [cursor=pointer]
        - group [ref=f2e318]:
